<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Owclude — Library</title>
<link rel="stylesheet" href="/Owclude/css/style.css">
<style>
  .lib-body{ flex:1; overflow-y:auto; padding:24px; }
  .lib-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; max-width:1100px; }
  .lib-card{
    background:var(--surface); border:1px solid var(--border);
    padding:14px; cursor:pointer; text-align:left;
  }
  .lib-card:hover{ border-color:var(--accent); }
  .lib-card .name{ font-weight:600; font-size:14px; margin-bottom:4px; word-break:break-word; }
  .lib-card .meta{ font-size:12px; color:var(--muted); }
  .lib-empty{ color:var(--muted); padding:40px 0; text-align:center; }
  .lib-card-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .lib-card .del{ font-size:11px; color:var(--danger); background:none; border:none; padding:2px; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="appbar">
    <div class="left">
      <a href="/index.html" class="back">&larr; Study Notes</a>
      <h2>Owclude</h2>
    </div>
    <div>
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
      <input type="file" id="zipInput" accept=".zip" style="display:none">
      <button id="importZipBtn">Import shared set (.zip)</button>
      <button id="importPdfBtn" class="primary">+ Import PDF</button>
    </div>
  </div>
  <div class="lib-body">
    <div id="libGrid" class="lib-grid"></div>
    <div id="libEmpty" class="lib-empty hidden">No PDFs yet — import one to start occluding.</div>
    <div id="libStatus" class="status" style="margin-top:16px;"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/Owclude/js/db.js"></script>
<script src="/Owclude/js/fingerprint.js"></script>
<script src="/Owclude/js/export-import.js"></script>
<script src="/Owclude/js/library.js"></script>
</body>
</html>
